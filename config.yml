# Site-wide settings. Per-model settings live next to each model as <TICKER>.yml
owner: "Jash (JJ) Rajgandhi"
site:
  title: "Model Builder — JJ Rajgandhi"
  tagline: "Full Excel models for any NYSE or Nasdaq company, built from SEC 10-K data."
  linkedin: ""        # e.g. https://www.linkedin.com/in/your-handle
  portfolio: ""       # link to your Bloomberg-terminal-style portfolio site
  email: ""
equity_risk_premium: 0.055   # used for the market-data WACC (Live_Data) and built models
ratings:              # rating = f(upside to target) unless a model's .yml sets `rating:`
  buy_above: 0.15
  sell_below: -0.10

# Fund dashboard. Leave holdings empty to use an equal-weight portfolio of every covered name.
portfolio:
  name: ""            # e.g. "SMIF — $550K actively managed fund"
  holdings: []        # e.g. [{ticker: LNG, shares: 120, sector: Energy}, {ticker: NEE, shares: 300}]
