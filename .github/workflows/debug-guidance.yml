name: Debug guidance
on:
  push:
    branches: [main]
    paths: ["tools/debug_guidance.py"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jash-financebro/equity-coverage-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 tools/debug_guidance.py
