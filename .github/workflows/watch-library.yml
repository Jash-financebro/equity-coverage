name: Watch library
run-name: Mark to market, score calls, rebuild on new filings

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays after the close
  workflow_dispatch: {}

permissions:
  contents: write
  packages: read

concurrency:
  group: rebuild-library
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/jash-financebro/equity-coverage-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Mark, score, rebuild
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 pipeline/watch.py
      - name: Save
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A library ':!library/index.json'
          git commit -q -m "Library: mark to market and filing watch $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git checkout -q -- library/index.json 2>/dev/null || rm -f library/index.json
            git rebase -q -X ours origin/main || { git rebase --abort; git pull -q --rebase -X theirs origin main; }
            python3 -c "import sys; sys.path.insert(0, 'pipeline'); import generate; generate.update_index()"
            git add library/index.json
            made=0; git commit -q -m "Library index: watch" && made=1
            git push -q origin HEAD:main && exit 0
            [ "$made" = 1 ] && git reset -q --hard HEAD~1
            sleep $((RANDOM % 6 + 2))
          done
          exit 1
