name: Deploy API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Check secrets
        id: chk
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$A" ] || [ -z "$B" ] || [ -z "$C" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / GH_DISPATCH_TOKEN repo secrets - skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Private storage for model uploads (Workers KV)
        if: steps.chk.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          NAME=model-builder-uploads
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -s -H "$auth" "$api?per_page=100" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((n['id'] for n in d.get('result') or [] if n['title']=='$NAME'),''))")
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" -d "{\"title\":\"$NAME\"}" "$api" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('id',''))")
          fi
          if [ -n "$id" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "UPLOADS"\nid = "%s"\n' "$id" >> wrangler.toml
            echo "KV namespace $NAME: $id"
          else
            echo "::warning::Could not create the KV namespace. Add 'Workers KV Storage: Edit' to the Cloudflare API token, then re-run. The Update tab stays off until then."
          fi
      - name: Deploy worker
        id: wr
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          secrets: |
            GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      - name: Publish API URL to the site
        if: steps.chk.outputs.ok == 'true'
        env:
          URL: ${{ steps.wr.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Worker URL: $URL"
          [ -n "$URL" ] || { echo "no deployment URL reported"; exit 1; }
          printf '{"api": "%s"}\n' "${URL%/}" > site/api.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api.json
          git diff --cached --quiet || { git commit -q -m "API URL: $URL" && git push -q origin HEAD:main; }
          gh workflow run refresh.yml --ref main
