name: Deploy API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Check secrets
        id: chk
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$A" ] || [ -z "$B" ] || [ -z "$C" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / GH_DISPATCH_TOKEN repo secrets - skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy worker
        id: wr
        if: steps.chk.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      - name: Publish API URL to the site
        if: steps.chk.outputs.ok == 'true'
        env:
          URL: ${{ steps.wr.outputs.deployment-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Worker URL: $URL"
          [ -n "$URL" ] || { echo "no deployment URL reported"; exit 1; }
          printf '{"api": "%s"}\n' "${URL%/}" > site/api.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api.json
          git diff --cached --quiet || { git commit -q -m "API URL: $URL" && git push -q origin HEAD:main; }
          gh workflow run refresh.yml --ref main
