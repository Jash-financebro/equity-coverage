name: Refresh models & deploy site

on:
  push:
    branches: [main]
    paths: ["models/**", "pipeline/**", "site/assets/**", "site/index.html", "templates/**", "config.yml", ".github/workflows/**"]
  schedule:
    - cron: "40 21 * * 1-5"   # weekdays, ~40 min after the US close (21:40 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice (headless) + Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui python3-uno fonts-liberation
          /usr/bin/python3 -m pip install --break-system-packages -q requests pyyaml openpyxl

      - name: Self-test (offline fixtures)
        run: /usr/bin/python3 tests/test_offline.py

      - name: Refresh every model from SEC EDGAR + market data
        env:
          # SEC asks every automated client to identify itself: "Name email@domain.com".
          # Set it under Settings → Secrets and variables → Actions → Variables.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: /usr/bin/python3 pipeline/run.py

      - name: Save refreshed data to the repo (keeps target-price history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/downloads
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
