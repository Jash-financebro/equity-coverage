name: Refresh models & deploy site

on:
  push:
    branches: [main]
    paths: ["models/**", "reports/**", "pipeline/**", "site/assets/**", "site/index.html", "templates/**",
            "config.yml", "tests/**", ".github/workflows/**"]
  schedule:
    - cron: "40 21 * * 1-5"   # weekdays, ~40 min after the US close (21:40 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  packages: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/jash-financebro/equity-coverage-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                 # always start from the latest data commit, not the triggering SHA
          fetch-depth: 0            # model "last updated" dates come from git history

      - name: Trust the workspace (git inside the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Self-test (offline fixtures)
        run: |
          python3 tests/test_builder.py
          python3 tests/test_offline.py
          python3 tests/test_generate.py

      - name: NYSE universe for the Generate tab (rebuilt weekly from SEC bulk data)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 pipeline/universe.py --if-stale 7

      - name: Refresh every model from SEC EDGAR + market data
        env:
          # SEC asks every automated client to identify itself: "Name email@domain.com".
          # Set it under Settings → Secrets and variables → Actions → Variables.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 pipeline/run.py

      - name: Open an issue for each new SEC filing (GitHub emails you)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          for a in json.load(open("site/data/alerts.json")):
              title = f"{a['ticker']}: new {a['form']} filed {a['filed']} — review the model"
              body = (f"SEC EDGAR shows a new **{a['form']}** for **{a['ticker']}** (period {a['period']}), "
                      f"filed {a['filed']}.\n\n- Filing: {a['url']}\n- Model last updated: {a['model_date']}\n\n"
                      "Roll the historicals and assumptions, commit the updated model, and close this issue. "
                      "The site shows a *Review* flag until the model is newer than the filing.")
              requests.post(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
                            headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                                     "Accept": "application/vnd.github+json"},
                            json={"title": title, "body": body}, timeout=30)
          PY

      - name: Save refreshed data to the repo (keeps target-price history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/downloads site/universe models
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # a newer refresh always wins over older generated data
          git push || (git pull --rebase -X theirs origin main && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true     # GitHub sometimes can't see a just-uploaded artifact yet
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
