name: Build runner image

on:
  push:
    branches: [main]
    paths: ["docker/runner/**", ".github/workflows/runner-image.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/runner
          push: true
          tags: ghcr.io/jash-financebro/equity-coverage-runner:latest
